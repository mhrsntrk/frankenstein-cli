name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Check formatting
        run: gofmt -l . | tee /dev/stderr | (! read)

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

      # The provider interface is the point of the design, so a leak is a
      # build failure rather than a review comment.
      - name: Check the provider boundary
        run: |
          leaked=$(grep -rl 'ProtonMail/go-proton-api' --include='*.go' internal/ cmd/ \
            | grep -vE 'internal/(mail/protonmail|auth)/' || true)
          if [ -n "$leaked" ]; then
            echo "Proton types leaked outside the adapter:"
            echo "$leaked"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: staticcheck
        # The packages copied from hey-cli are skipped. They carry helpers this
        # client does not call, and staticcheck's unused check flags every one
        # of them; deleting them to satisfy it would make the files stop
        # matching upstream, which is the whole point of keeping them verbatim.
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck $(go list ./... | grep -Ev '/internal/(tui/heyui|tui/heymodel|habit|terminal)$')
