name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - run: gofmt -l . | tee /dev/stderr | (! read)
        name: Check formatting

      - run: go vet ./...

      - run: go test -race ./...

      - run: go build ./...
