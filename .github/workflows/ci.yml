name: ci

on:
  push:
    # The default branch is main. master is listed too so an older clone, or
    # a revert of the rename, does not silently turn push CI off.
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Check formatting
        run: gofmt -l . | tee /dev/stderr | (! read)

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

      # The provider interface is the point of the design, so a leak is a
      # build failure rather than a review comment.
      - name: Check the provider boundary
        run: |
          leaked=$(grep -rl 'ProtonMail/go-proton-api' --include='*.go' internal/ cmd/ \
            | grep -vE 'internal/(mail/protonmail|auth)/' || true)
          if [ -n "$leaked" ]; then
            echo "Proton types leaked outside the adapter:"
            echo "$leaked"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      # The version pin and the skipped-package list live in the Makefile, so
      # `make staticcheck` locally runs the same checker over the same packages
      # as CI. internal/tui/render, internal/tui/render/habit and internal/terminal are
      # skipped: they are copied from hey-cli and kept diffable against
      # upstream, so they carry helpers this client never calls and every one of
      # them trips the unused check. See NOTICE.
      - name: staticcheck
        run: make staticcheck
