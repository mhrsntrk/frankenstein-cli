name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # The same target CI runs: formatting, vet, build, race tests,
      # staticcheck and the provider boundary. A bare `go test` here would let a
      # tag ship what a pull request would have been blocked on.
      - name: Check before releasing
        run: make check

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A PAT with contents:write on mhrsntrk/homebrew-tap.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # The private half of the SSH key registered with the AUR account.
          AUR_KEY: ${{ secrets.AUR_KEY }}
